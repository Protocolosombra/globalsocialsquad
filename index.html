<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Squad</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    
    body {
      background-color: #06040c;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* Marco del teléfono */
    .phone-shell {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(180deg, #1b153d 0%, #0d0921 100%);
      border-radius: 36px;
      padding: 18px 16px 24px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 50px rgba(79, 172, 254, 0.2);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Bar / Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
    }

    .menu-icon {
      font-size: 20px;
      cursor: pointer;
      color: #d1c4e9;
    }

    .app-title {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
      color: #38ef7d;
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, #60efff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(96, 239, 255, 0.4);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .badge-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ff3b30;
      color: white;
      font-size: 9px;
      font-weight: 800;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Section: Character & Map */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 10px;
      height: 180px;
    }

    .character-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      position: relative;
    }

    .character-img {
      height: 175px;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
    }

    .map-container {
      background: radial-gradient(circle at center, #2d225e 0%, #150f38 100%);
      border-radius: 20px;
      border: 1px solid rgba(96, 239, 255, 0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow: hidden;
    }

    /* SVG Map Graphic */
    .map-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    .squads-pill {
      position: relative;
      z-index: 2;
      background: rgba(18, 14, 45, 0.85);
      border: 1px solid #60efff;
      color: #60efff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(96, 239, 255, 0.3);
      margin-top: auto;
    }

    /* Card Containers */
    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
    }

    .points-badge {
      font-size: 12px;
      font-weight: 700;
      color: #ffd166;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .progress-label {
      font-size: 11px;
      color: #a097c4;
      margin-bottom: 6px;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 10px;
      background: #110c2e;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      width: 65%;
      height: 100%;
      background: linear-gradient(90deg, #ff9f43 0%, #ff5252 100%);
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(255, 159, 67, 0.6);
    }

    /* CTA Button */
    .cta-button {
      width: 100%;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      color: #030818;
      font-weight: 900;
      font-size: 15px;
      padding: 13px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
      letter-spacing: 0.3px;
      transition: transform 0.2s;
    }

    .cta-button:active {
      transform: scale(0.98);
    }

    /* Leaderboard */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 13, 46, 0.6);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-num {
      font-weight: 800;
      font-size: 13px;
      color: #ff9f43;
      min-width: 28px;
    }

    .squad-title {
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #e2d9f3;
    }

    .squad-score {
      font-weight: 800;
      font-size: 13px;
      color: #ffd166;
      display: flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <div class="phone-shell">
    
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="menu-icon">☰</div>
      <div class="app-title">SOCIAL<br>SQUAD</div>
      <div class="header-actions">
        <div class="action-btn">
          👤<div class="badge-dot">1</div>
        </div>
        <div class="action-btn">
          🔔<div class="badge-dot">2</div>
        </div>
      </div>
    </div>

    <!-- Hero: Character & Map -->
    <div class="hero-grid">
      <div class="character-container">
        <!-- 3D Standing Character Avatar -->
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/25.png" style="display:none;">
        <svg class="character-img" viewBox="0 0 100 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Head & Hair -->
          <path d="M50 20C38 20 32 28 32 40C32 50 38 56 50 56C62 56 68 50 68 40C68 28 62 20 50 20Z" fill="#F4C29F"/>
          <path d="M32 32C30 24 38 14 50 14C62 14 70 24 68 32C64 22 56 18 50 18C44 18 36 22 32 32Z" fill="#3D2314"/>
          <!-- Face details -->
          <circle cx="44" cy="38" r="2.5" fill="#222"/>
          <circle cx="56" cy="38" r="2.5" fill="#222"/>
          <path d="M47 46Q50 49 53 46" stroke="#C87A57" stroke-width="2" stroke-linecap="round"/>
          <!-- Jacket & Torso -->
          <path d="M30 58L22 100H36L42 62H58L64 100H78L70 58H30Z" fill="#1C2D42"/>
          <path d="M42 58H58V95H42V58Z" fill="#FFFFFF"/>
          <!-- Legs & Shoes -->
          <path d="M36 100L32 145H44L46 100H36Z" fill="#151722"/>
          <path d="M54 100L56 145H68L64 100H54Z" fill="#151722"/>
          <path d="M28 143H45V152C45 152 35 154 28 152V143Z" fill="#FF3B30"/>
          <path d="M55 143H72V152C72 152 65 154 55 152V143Z" fill="#FF3B30"/>
        </svg>
      </div>

      <div class="map-container">
        <!-- SVG Map Vector -->
        <svg class="map-bg" viewBox="0 0 100 100">
          <path d="M10,30 Q20,25 35,35 T60,25 T90,30" stroke="rgba(96,239,255,0.3)" stroke-width="1" fill="none" stroke-dasharray="2 2"/>
          <path d="M15,60 Q40,50 65,65 T85,55" stroke="rgba(96,239,255,0.3)" stroke-width="1" fill="none" stroke-dasharray="2 2"/>
          <!-- Location Pins -->
          <circle cx="25" cy="30" r="4" fill="#00E676" />
          <circle cx="65" cy="25" r="4" fill="#FFD166" />
          <circle cx="75" cy="60" r="4" fill="#FF007A" />
        </svg>

        <div></div>
        <div class="squads-pill">
          <span>📍</span> Squads
        </div>
      </div>
    </div>

    <!-- Daily Quest Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Daily Quest</span>
        <span class="points-badge">🪙 Nueszyt</span>
      </div>
      <div class="progress-label">Progress</div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <button class="cta-button">Recruit New Members</button>
    </div>

    <!-- Squad Leaderboard Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Squad Leaderboard</span>
      </div>
      
      <div class="leaderboard-list">
        <div class="leaderboard-item">
          <div class="item-left">
            <span class="rank-num">#1 🔥</span>
            <span class="squad-title">SQUAD: LA FUEGO</span>
          </div>
          <span class="squad-score">🏆 257</span>
        </div>

        <div class="leaderboard-item">
          <div class="item-left">
            <span class="rank-num" style="color:#aaa;">#2 🏆</span>
            <span class="squad-title">SQUAD: LA FUEGO</span>
          </div>
          <span class="squad-score">🏆 200</span>
        </div>

        <div class="leaderboard-item">
          <div class="item-left">
            <span class="rank-num" style="color:#cd7f32;">#3 🏆</span>
            <span class="squad-title">SQUAD: LA FUEGO</span>
          </div>
          <span class="squad-score">🏆 175</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
